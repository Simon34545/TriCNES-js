<!DOCTYPE html>
<html>
	<head>
		<style>
			canvas {
				image-rendering: -webkit-optimize-contrast;
				image-rendering: -moz-crisp-edges;
				image-rendering: pixelated;
			}
			
			body {
				margin: 0px;
				background-color: #000;
				color: #ccc;
				font-family: monospace;
			}
		</style>
		<title>Coin's Contrabulous Cartswapulator</title>
	</head>
	<body>
		<canvas id="screen" width="256" height="240" style="width: 640px; height: 480px;"></canvas>
		<br>
		<span id="ms"></span>
		<br>
		<span>XZ⇧⏎↑↓←→</span>
		<br>
		<span id="c1"></span>
		<br>
		<span id="c2"></span>
		<br>
		<span>Press:</span>
		<br>
		<span>V to toggle vsync</span>
		<br>
		<span>R to reset</span>
		<br>
		<span>L to load a ROM</span>
		<br>
		<span>T to load a TAS</span>
		<br>
		<span>N to toggle NTSC decoding</span>
		<br>
		<span>S to change screen size</span>
		<script src="Emulator.js"></script>
		<script src="AccuracyCoin.js"></script>
		<script src="main.js"></script>
		<script src="audio.js"></script>
		<script src="coi-serviceworker.js"></script>
	</body>
</html>
