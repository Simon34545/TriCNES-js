<!DOCTYPE html>
<html>
	<head>
		<style>
			canvas {
				image-rendering: -webkit-optimize-contrast;
				image-rendering: -moz-crisp-edges;
				image-rendering: pixelated;
			}
			
			body {
				margin: 0px;
				background-color: #000;
				color: #ccc;
				font-family: monospace;
			}
		</style>
		<title>Coin's Contrabulous Cartswapulator</title>
		<script src="options.js"></script>
		<script src="./jszip/jszip.min.js"></script>
	</head>
	<body>
		<canvas id="screen"></canvas>
		<canvas id="nametables" width="512" height="480" style="width: 512px; height: 480px;"></canvas>
		<br>
		<span id="ms"></span>
		<br>
		<span>XZ⇧⏎↑↓←→</span>
		<br>
		<span id="c1"></span>
		<br>
		<span id="c2"></span>
		<br>
		<span>Press:</span>
		<br>
		<span>R to reset</span>
		<br>
		<span>L to load a ROM</span>
		<br>
		<span>T to load a TAS</span>
		<br>
		<span>S to change screen size</span>
		<br>
		<span>+/- to change speed</span>
		<br>
		<br>
		<span>Display Settings:</span>
		<br>
		<span>VSync:</span>
		<input type="checkbox" id="vsync" \>
		<br>
		<span>Decode NTSC signal:</span>
		<input type="checkbox" id="ntsc" \>
		<br>
		<span>Show borders:</span>
		<input type="checkbox" id="borders" \>
		<br>
		<br>
		<span>Nametable Viewer:</span>
		<br>
		<span>Enabled:</span>
		<input type="checkbox" id="ntviewer" \>
		<br>
		<span>Use backdrop color for index 0:</span>
		<input type="checkbox" id="bg0" \>
		<br>
		<span>Show screen borders:</span>
		<input type="checkbox" id="sborder" \>
		<br>
		<span>Overlay screen:</span>
		<input type="checkbox" id="soverlay" \>
		<script src="Emulator.js"></script>
		<script src="AccuracyCoin.js"></script>
		<script src="main.js"></script>
		<script src="tas.js"></script>
		<script src="audio.js"></script>
		<script src="record.js"></script>
		<script src="coi-serviceworker.js"></script>
	</body>
</html>
